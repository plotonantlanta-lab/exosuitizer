<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="rgb(0, 0, 254)">
  <title>Exosuitizer — обработка медиа</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <button type="button" id="left-rail" class="brand-rail brand-rail-left" aria-label="Переместить синюю полосу вправо" aria-pressed="true"><span class="rail-message">экзосьют вышел</span></button>
  <button type="button" id="right-rail" class="brand-rail brand-rail-right" aria-label="Переместить синюю полосу влево" aria-pressed="false" tabindex="-1"><span class="rail-message">экзосьют вышел</span></button>
  <div class="page">
    <header class="site-header">
      <h1>Exosuitizer</h1>
      <a class="exosuit-link" href="https://band.link/exosuitt" target="_blank" rel="noopener noreferrer">exosuit</a>
    </header>

    <main>
      <section class="controls" aria-label="Параметры обработки">
        <div class="segmented" role="group" aria-label="Выберите сторону полосы">
          <button type="button" class="side-button is-selected" data-side="bottom" aria-pressed="true"><input class="side-checkbox" type="checkbox" checked tabindex="-1" aria-hidden="true"><span>Снизу</span></button>
          <button type="button" class="side-button" data-side="right" aria-pressed="false"><input class="side-checkbox" type="checkbox" tabindex="-1" aria-hidden="true"><span>Справа</span></button>
          <button type="button" class="side-button" data-side="left" aria-pressed="false"><input class="side-checkbox" type="checkbox" tabindex="-1" aria-hidden="true"><span>Слева</span></button>
          <button type="button" class="side-button" data-side="top" aria-pressed="false"><input class="side-checkbox" type="checkbox" tabindex="-1" aria-hidden="true"><span>Сверху</span></button>
        </div>
      </section>

      <section class="workspace" aria-label="Обработка медиа">
        <div class="media-column">
          <h2>Исходник</h2>
          <button type="button" id="source-frame" class="preview-frame source-frame" aria-label="Выбрать фото, GIF или видео">
            <span id="source-hint" class="placeholder">Нажмите или перетащите фото, GIF или видео</span>
            <img id="source-image" class="media-preview" alt="Исходное изображение" hidden>
            <video id="source-video" class="media-preview" muted playsinline controls hidden></video>
          </button>
          <button type="button" id="upload-button" class="utility-button">Загрузить фото...</button>
          <input id="file-input" type="file" accept="image/*,video/*" hidden>
        </div>

        <div class="action-column">
          <button type="button" id="process-button" class="process-button" disabled aria-label="Обработать медиа">
            <img src="btn 2 big.png" alt="Эксайтизировать">
          </button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </div>

        <div class="media-column">
          <h2>Результат</h2>
          <div id="result-frame" class="preview-frame result-frame" aria-label="Результат обработки">
            <span id="result-hint" class="placeholder">Здесь появится обработанное медиа</span>
            <img id="result-image" class="media-preview" alt="Обработанный результат" hidden>
            <video id="result-video" class="media-preview" controls playsinline hidden></video>
          </div>
          <button type="button" id="download-button" class="utility-button" disabled>Скачать результат</button>
        </div>
      </section>
    </main>
    <footer>
      <div class="footer-links">
        <a href="https://t.me/mej1ch" target="_blank" rel="noopener noreferrer">by mej1ch</a>
        <a href="https://t.me/mm44turboshitpostmachine" target="_blank" rel="noopener noreferrer">for mm44 turbo shitpost machine</a>
      </div>
    </footer>
  </div>
</body>
</html>
